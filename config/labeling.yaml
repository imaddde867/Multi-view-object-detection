videos:
  - data/raw/testing_videos/Cam1.mp4
  - data/raw/testing_videos/Cam2.mp4
  - data/raw/testing_videos/Cam3.mp4
  - data/raw/testing_videos/Cam4.mp4
  - data/raw/testing_videos/Cam5.mp4
  - data/raw/testing_videos/Cam6.mp4
  - data/raw/testing_videos/Cam7.mp4
  - data/raw/testing_videos/Cam8.mp4

out: data/processed/sam3_autolabel

targets: person,car,bus

# Stronger proposals help SAM3 converge on the right object masks.
# Override on HPC with `--proposal-model yolo11m.pt` if available.
proposal_model: yolov8n.pt
# If your objects are small/crowded (e.g. Cam1/Cam2), bump this up (e.g. 1280 or 1536)
# and/or use a larger proposal model (e.g. `yolov8x.pt` or `yolo11m.pt`).
proposal_imgsz: 1280
source_map: truck=car,motorcycle=car,bicycle=car
conf: 0.35
iou: 0.5
frame_stride: 5
max_frames_per_video: 4000
train_ratio: 0.9
val_ratio: 0.1
seed: 0
min_box_area: 400
keep_empty: false
save_viz: false

sam3:
  checkpoint: ""
  load_from_hf: false
  device: cuda
  confidence: 0.5
  mask_close: 7
  nms_iou: 0.5

runtime:
  device: cuda:0
  half: true
