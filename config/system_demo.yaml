# Demo run config for the new synced videos (1280x720 @ 29.97 fps).

cameras:
  demo1: {source: data/raw/demo_videos/demo1.mov}
  demo2: {source: data/raw/demo_videos/demo2.mp4}

groups:
  demo: [demo1, demo2]

detector:
  model: results/training/sam3_autolabel_v2/weights/best.pt
  imgsz: 960
  conf: 0.35
  iou: 0.5
  targets: person,car,bus
  source_map: truck=car,motorcycle=car,bicycle=car

tracker:
  max_age: 30
  match_threshold: 0.5
  global_match_threshold: 0.75
  embedder:
    type: colorhist
    bins: 16

run:
  frame_stride: 1
  max_frames: null
  groups: [demo]

output:
  dir: results/system/demo_run
  write_video: true
  video_fps: 29.97

runtime:
  device: cuda:0
  half: false
