# Puhti tuned config for g78 (Cam7/Cam8).

cameras:
  cam7:
    source: data/raw/testing_videos/Cam7.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam8:
    source: data/raw/testing_videos/Cam8.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]

groups:
  g78: [cam7, cam8]

detector:
  model: results/training/sam3_autolabel_v2/weights/best.pt
  imgsz: 960
  conf: 0.5
  iou: 0.45
  max_det: 200
  targets: person,car,bus
  source_map: truck=car,motorcycle=car,bicycle=car

tracker:
  max_age: 45
  match_threshold: 0.5
  global_match_threshold: 0.7
  global_max_age: 45
  spatial_weight: 0.4
  spatial_sigma: 3.0
  spatial_max_dist: 8.0
  embedding_alpha: 0.6
  world_alpha: 0.6
  embedder:
    type: torch_resnet18

run:
  frame_stride: 1
  max_frames: null
  groups: [g78]

output:
  dir: results/system/puhti_eval_g78_tuned
  write_video: true
  video_fps: 0.0

runtime:
  device: cuda:0
  half: false
