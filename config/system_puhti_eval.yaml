# Puhti eval config for g34/g56/g78 pairs (Cam3-8).

cameras:
  cam1: {source: data/raw/testing_videos/Cam1.mp4}
  cam2: {source: data/raw/testing_videos/Cam2.mp4}
  cam3: {source: data/raw/testing_videos/Cam3.mp4}
  cam4: {source: data/raw/testing_videos/Cam4.mp4}
  cam5: {source: data/raw/testing_videos/Cam5.mp4}
  cam6: {source: data/raw/testing_videos/Cam6.mp4}
  cam7: {source: data/raw/testing_videos/Cam7.mp4}
  cam8: {source: data/raw/testing_videos/Cam8.mp4}

groups:
  g12: [cam1, cam2]
  g34: [cam3, cam4]
  g56: [cam5, cam6]
  g78: [cam7, cam8]

detector:
  model: results/training/sam3_autolabel_v2/weights/best.pt
  imgsz: 960
  conf: 0.35
  iou: 0.5
  targets: person,car,bus
  source_map: truck=car,motorcycle=car,bicycle=car

tracker:
  max_age: 30
  match_threshold: 0.5
  global_match_threshold: 0.75
  embedder:
    type: colorhist
    bins: 16

run:
  frame_stride: 1
  max_frames: null
  groups: [g34, g56, g78]

output:
  dir: results/system/puhti_eval_g34_g56_g78
  write_video: true
  video_fps: 0.0

runtime:
  device: cuda:0
  half: false
