# Puhti spatial run config (Cam3-8 pairs).
# Fill per-camera homography or point correspondences to enable spatial matching.
# If neither is set for a camera, spatial matching is ignored for that camera.

cameras:
  cam3:
    source: data/raw/testing_videos/Cam3.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam4:
    source: data/raw/testing_videos/Cam4.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam5:
    source: data/raw/testing_videos/Cam5.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam6:
    source: data/raw/testing_videos/Cam6.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam7:
    source: data/raw/testing_videos/Cam7.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]
  cam8:
    source: data/raw/testing_videos/Cam8.mp4
    # homography: [[h11, h12, h13], [h21, h22, h23], [h31, h32, h33]]
    # image_points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]
    # world_points: [[X1, Y1], [X2, Y2], [X3, Y3], [X4, Y4]]

groups:
  g34: [cam3, cam4]
  g56: [cam5, cam6]
  g78: [cam7, cam8]

detector:
  model: results/training/sam3_autolabel_v2/weights/best.pt
  imgsz: 960
  conf: 0.35
  iou: 0.5
  targets: person,car,bus
  source_map: truck=car,motorcycle=car,bicycle=car

tracker:
  max_age: 30
  match_threshold: 0.5
  global_match_threshold: 0.75
  global_max_age: 30
  spatial_weight: 0.4
  spatial_sigma: 3.0
  spatial_max_dist: 8.0
  embedding_alpha: 0.6
  world_alpha: 0.6
  embedder:
    type: torch_resnet18
    # device: cuda:0
    # If torchvision is missing, switch to "colorhist".

run:
  frame_stride: 1
  max_frames: null
  groups: [g34, g56, g78]

output:
  dir: results/system/puhti_eval_g34_g56_g78_spatial
  write_video: true
  video_fps: 0.0

runtime:
  device: cuda:0
  half: false
