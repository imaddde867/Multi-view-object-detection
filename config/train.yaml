data: data/processed/sam3_autolabel_allcams/dataset.yaml

# Default to a local checkpoint to avoid network downloads on HPC.
# Override freely (e.g. yolov8m.pt / yolo11m.pt) if available.
model: yolov8n.pt

epochs: 100
imgsz: 960
batch: 16
seed: 0
workers: 8

project: results/training  # For tracked runs, use results/showcase/training/<run_name>
name: sam3_autolabel_allcams_yolov8n

runtime:
  # For multi-GPU on SLURM: "0,1" or "0,1,2,3"
  device: 0
  half: true
