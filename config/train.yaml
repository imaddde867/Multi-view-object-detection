data: data/processed/sam3_autolabel_v2/dataset.yaml

# Default to a local checkpoint to avoid network downloads on HPC.
# Override freely if you want a different base model.
model: checkpoints/yolo/yolo11m.pt

epochs: 100
imgsz: 960
batch: 16
seed: 0
workers: 8

project: results/training  # For tracked runs, use results/showcase/training/<run_name>
# Change the name to avoid overwriting an existing run.
name: sam3_autolabel_v2

runtime:
  # For multi-GPU on SLURM: "0,1" or "0,1,2,3"
  device: 0
  half: true
