# Example multi-view system config (camera pairs + groups).
#
# Define cameras once, then compose any camera pairs/groups under `groups`.

cameras:
  cam1: {source: data/raw/testing_videos/Cam1.mp4}
  cam2: {source: data/raw/testing_videos/Cam2.mp4}
  cam3: {source: data/raw/testing_videos/Cam3.mp4}
  cam4: {source: data/raw/testing_videos/Cam4.mp4}
  cam5: {source: data/raw/testing_videos/Cam5.mp4}
  cam6: {source: data/raw/testing_videos/Cam6.mp4}
  cam7: {source: data/raw/testing_videos/Cam7.mp4}
  cam8: {source: data/raw/testing_videos/Cam8.mp4}

groups:
  g12: [cam1, cam2]
  g34: [cam3, cam4]
  g56: [cam5, cam6]
  g78: [cam7, cam8]

detector:
  # After training, this should exist:
  model: results/training/sam3_autolabel_allcams_yolov8n/weights/best.pt
  imgsz: 960
  conf: 0.35
  iou: 0.5
  targets: person,car
  source_map: truck=car,motorcycle=car,bicycle=car

tracker:
  max_age: 30
  match_threshold: 0.5
  global_match_threshold: 0.75
  embedder:
    # Options: "colorhist" (no torch), "torch_resnet18" (best)
    type: colorhist

run:
  frame_stride: 1
  max_frames: null
  groups: [] # empty means run all groups

output:
  dir: results/system
  write_video: true
  video_fps: 0.0

runtime:
  device: cuda:0
  half: false
